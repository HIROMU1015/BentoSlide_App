name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  app-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: app/frontend
        run: npm ci

      - name: Test and build BentoSlide App frontend
        working-directory: app/frontend
        run: |
          mkdir -p ../../ci-output
          set -o pipefail
          npm test 2>&1 | tee ../../ci-output/app-frontend-test-output.txt
          npm run build 2>&1 | tee ../../ci-output/app-frontend-build-output.txt

      - name: Upload frontend evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-frontend-evidence
          if-no-files-found: warn
          path: |
            ci-output/app-frontend-test-output.txt
            ci-output/app-frontend-build-output.txt

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-browser.txt
            requirements-ai.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-browser.txt -r requirements-ai.txt

      - name: Build and validate deterministic demo
        run: |
          mkdir -p ci-output
          python -m scripts.build_bento --base Bento_Slides.base.bento.html --design gpt_bento_design.json --output demo.generated.bento.html
          python -m scripts.validate_bento demo.generated.bento.html --base Bento_Slides.base.bento.html
          cmp demo.generated.bento.html demo.bento.html
          echo PASS > ci-output/legacy-byte-match.txt

      - name: Validate local workflow state and preview
        run: |
          python -m scripts.deck_workflow validate
          python -m scripts.deck_workflow status --json

      - name: Run unit and non-browser integration tests
        run: |
          set -o pipefail
          python -m scripts.run_ci_test_group unit --verbosity 2 2>&1 | tee ci-output/test-output.txt

      - name: Upload unit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-evidence
          if-no-files-found: warn
          path: |
            ci-output/test-output.txt
            ci-output/legacy-byte-match.txt

  html-first-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-browser.txt

      - name: Restore Playwright Chromium cache
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('requirements-browser.txt') }}

      - name: Install browser dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-browser.txt
          python -m playwright install-deps chromium
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" != "true" ]; then python -m playwright install chromium; fi

      - name: Build HTML-first feature matrix and evidence bundle
        run: |
          mkdir -p ci-output
          python -m scripts.build_bento_from_html --html-dir tests/fixtures/html_first --registry-dir tests/fixtures/html_first --base Bento_Slides.base.bento.html --output ci-output/presentation.generated.bento.html
          python -m scripts.validate_bento ci-output/presentation.generated.bento.html --base Bento_Slides.base.bento.html

      - name: Create Work editor save evidence
        run: |
          python -m scripts.check_work_editor --source ci-output/presentation.generated.bento.html --evidence-dir ci-output/work-editor-evidence --registry ci-output/diagnostics/merged-registry.json --output ci-output/work-editor-evidence/work-editor-report.json

      - name: Run all classified browser contracts
        env:
          BENTO_BROWSER_TEST: "1"
        run: |
          set -o pipefail
          python -m scripts.run_ci_test_group browser --verbosity 2 2>&1 | tee ci-output/browser-test-output.txt

      - name: Upload browser integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-integration-evidence
          if-no-files-found: warn
          path: |
            ci-output/presentation.generated.bento.html
            ci-output/presentation.generated.bento.json
            ci-output/conversion-report.json
            ci-output/browser-test-output.txt
            ci-output/diagnostics/
            ci-output/screenshots/source/
            ci-output/screenshots/bento/
            ci-output/work-editor-evidence/

  determinism:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-browser.txt

      - name: Restore Playwright Chromium cache
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('requirements-browser.txt') }}

      - name: Install browser dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-browser.txt
          python -m playwright install-deps chromium
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" != "true" ]; then python -m playwright install chromium; fi

      - name: Verify modular and single-file independent builds
        run: |
          mkdir -p ci-output
          python -m scripts.check_html_first_determinism --html-dir tests/fixtures/html_first --registry-dir tests/fixtures/html_first --base Bento_Slides.base.bento.html --report ci-output/determinism-report.json
          python -m scripts.check_html_first_determinism --html tests/fixtures/html_first/chapter-01.preview.html --registry tests/fixtures/html_first/chapter-01.registry.json --base Bento_Slides.base.bento.html --report ci-output/single-determinism-report.json
          python -m scripts.run_ci_test_group determinism --verbosity 2 2>&1 | tee ci-output/determinism-test-output.txt

      - name: Upload determinism evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: determinism-evidence
          if-no-files-found: warn
          path: |
            ci-output/determinism-report.json
            ci-output/single-determinism-report.json
            ci-output/determinism-test-output.txt

  evidence-summary:
    runs-on: ubuntu-latest
    needs: [app-frontend, unit, html-first-integration, determinism]
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Download parallel job evidence
        uses: actions/download-artifact@v4
        with:
          pattern: "*-evidence"
          path: ci-output
          merge-multiple: true

      - name: Write Bento job summary
        run: python -m scripts.write_ci_summary --report ci-output/conversion-report.json --determinism ci-output/determinism-report.json --tests ci-output/test-output.txt --legacy ci-output/legacy-byte-match.txt --work-editor ci-output/work-editor-evidence/work-editor-report.json --output "$GITHUB_STEP_SUMMARY"

      - name: Upload combined HTML-first evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: html-first-evidence
          if-no-files-found: warn
          path: ci-output/

  windows-launcher:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-browser.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json

      - name: Install launcher dependencies
        run: |
          python -m pip install -r requirements-browser.txt
          npm ci --prefix app/frontend
          npm run build --prefix app/frontend

      - name: Run Windows launcher tests
        shell: pwsh
        run: |
          $env:BENTO_PYTHON = (Get-Command python.exe).Source
          $testOutput = (& python -m scripts.run_ci_test_group windows --verbosity 2 2>&1 | Out-String)
          $testExitCode = $LASTEXITCODE
          Write-Host $testOutput
          if ($testExitCode -ne 0) {
            $annotation = $testOutput.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Windows launcher tests::$annotation"
            exit $testExitCode
          }

      - name: Smoke test BentoSlide App launcher
        shell: pwsh
        env:
          BENTO_EDITOR_NO_PAUSE: "1"
        run: |
          $env:BENTO_PYTHON = (Get-Command python.exe).Source
          $sessionPath = Join-Path $PWD "output/bentoslide-app-session.json"
          $pidPath = Join-Path $PWD "output/bentoslide-app.pid"
          $listener = $null
          try {
            & .\start_bentoslide_app.cmd -NoBrowser -NoClipboard
            if ($LASTEXITCODE -ne 0) { throw "start_bentoslide_app.cmd failed: $LASTEXITCODE" }
            $first = Get-Content $sessionPath -Raw -Encoding utf8 | ConvertFrom-Json
            $health = Invoke-RestMethod -Uri ($first.url + "api/health")
            if ($health.status -ne "ok") { throw "BentoSlide App health check failed" }

            & .\start_bentoslide_app.cmd -NoBrowser -NoClipboard
            if ($LASTEXITCODE -ne 0) { throw "duplicate app start failed: $LASTEXITCODE" }
            $duplicate = Get-Content $sessionPath -Raw -Encoding utf8 | ConvertFrom-Json
            if ($duplicate.pid -ne $first.pid) { throw "duplicate app process was started" }

            & .\stop_bentoslide_app.cmd
            if ($LASTEXITCODE -ne 0) { throw "stop_bentoslide_app.cmd failed: $LASTEXITCODE" }
            if (Get-Process -Id $first.pid -ErrorAction SilentlyContinue) { throw "BentoSlide App process is still running" }
            if ((Test-Path $pidPath) -or (Test-Path $sessionPath)) { throw "BentoSlide App session files remain" }

            $listener = [System.Net.Sockets.TcpListener]::new([System.Net.IPAddress]::Loopback, 0)
            $listener.Start()
            $busyPort = ([System.Net.IPEndPoint]$listener.LocalEndpoint).Port
            $previousNativePreference = $PSNativeCommandUseErrorActionPreference
            try {
              $PSNativeCommandUseErrorActionPreference = $false
              $conflictOutput = (& .\start_bentoslide_app.cmd -Port $busyPort -NoBrowser -NoClipboard 2>&1 | Out-String)
              $conflictExitCode = $LASTEXITCODE
              $global:LASTEXITCODE = 0
            }
            finally { $PSNativeCommandUseErrorActionPreference = $previousNativePreference }
            if ($conflictExitCode -eq 0) { throw "BentoSlide App accepted a conflicting port" }
            if ($conflictOutput -notmatch "used by another service") { throw "Unexpected port-conflict error: $conflictOutput" }
            if ($conflictOutput -match "Started server process") { throw "Port conflict printed stale backend stderr: $conflictOutput" }
            if ((Test-Path $pidPath) -or (Test-Path $sessionPath)) { throw "Port conflict left app session files" }
          }
          finally {
            if (Test-Path $sessionPath) { & .\stop_bentoslide_app.cmd }
            if ($null -ne $listener) { $listener.Stop() }
          }

      - name: Stop BentoSlide App after failed smoke test
        if: always()
        shell: pwsh
        run: |
          if (Test-Path output/bentoslide-app-session.json) {
            & .\stop_bentoslide_app.cmd
          }

      - name: Smoke test CMD launchers from a spaced Japanese path
        shell: pwsh
        env:
          BENTO_EDITOR_NO_PAUSE: "1"
        run: |
          $env:BENTO_PYTHON = (Get-Command python.exe).Source
          $sourceRoot = $PWD
          $archive = Join-Path $env:RUNNER_TEMP "bento-launcher.zip"
          $copy = Join-Path $env:RUNNER_TEMP "Bento Slide 論文スライド"
          git archive --format=zip --output=$archive HEAD
          Expand-Archive -LiteralPath $archive -DestinationPath $copy
          Copy-Item -LiteralPath (Join-Path $sourceRoot "app/frontend/dist") `
            -Destination (Join-Path $copy "app/frontend/dist") -Recurse
          Set-Location $copy
          $wholeDeckState = Join-Path $env:RUNNER_TEMP "whole-deck-html-review.yaml"
          Copy-Item deck.yaml $wholeDeckState
          New-Item -ItemType Directory -Force output/diagnostics | Out-Null
          Copy-Item demo.bento.html output/presentation.generated.bento.html
          Set-Content output/diagnostics/merged-registry.json "{}" -Encoding utf8
          $callNumber = 0
          function Invoke-CmdLauncher([string]$Path, [string]$Arguments = "") {
            $script:callNumber += 1
            $stdout = Join-Path $copy "launcher-call-$script:callNumber.log"
            $stderr = Join-Path $copy "launcher-call-$script:callNumber.error.log"
            # Explorer commonly starts Windows PowerShell 5.1 from a CP932 console.
            # Reproduce that boundary so UTF-8 native JSON decoding is covered.
            $commandLine = "/d /s /c `"chcp 932 >nul & call `"$Path`" $Arguments`""
            $process = Start-Process -FilePath cmd.exe -ArgumentList $commandLine -PassThru `
              -RedirectStandardOutput $stdout -RedirectStandardError $stderr
            if (-not $process.WaitForExit(60000)) {
              try { $process.Kill() } catch { }
              throw "CMD launcher timed out: $Path $Arguments"
            }
            if ($process.ExitCode -ne 0) {
              Get-Content $stdout, $stderr -ErrorAction SilentlyContinue
            }
            return $process.ExitCode
          }
          $appPortProbe = [System.Net.Sockets.TcpListener]::new([System.Net.IPAddress]::Loopback, 0)
          $appPortProbe.Start()
          $appPort = ([System.Net.IPEndPoint]$appPortProbe.LocalEndpoint).Port
          $appPortProbe.Stop()
          $appArguments = "-Port $appPort -NoBrowser -NoClipboard"
          $exitCode = Invoke-CmdLauncher (Join-Path $copy "start_bentoslide_app.cmd") $appArguments
          if ($exitCode -ne 0) { throw "Japanese-path start_bentoslide_app.cmd failed: $exitCode" }
          $appSession = Get-Content output/bentoslide-app-session.json -Raw -Encoding utf8 | ConvertFrom-Json
          $appHealth = Invoke-RestMethod -Uri ($appSession.url + "api/health")
          $appProjectJson = (& python -X utf8 -c `
            "import sys, urllib.request; sys.stdout.write(urllib.request.urlopen(sys.argv[1]).read().decode('utf-8'))" `
            ($appSession.url + "api/project"))
          $appProject = ($appProjectJson -join "`n") | ConvertFrom-Json
          if ($appHealth.status -ne "ok" -or $appProject.project.title -ne "BentoSlide0を実際に使う") {
            throw "Japanese project title was not preserved by the BentoSlide App launcher"
          }
          $firstAppPid = $appSession.pid
          $exitCode = Invoke-CmdLauncher (Join-Path $copy "start_bentoslide_app.cmd") $appArguments
          if ($exitCode -ne 0) { throw "Japanese-path duplicate app start failed: $exitCode" }
          $duplicateApp = Get-Content output/bentoslide-app-session.json -Raw -Encoding utf8 | ConvertFrom-Json
          if ($duplicateApp.pid -ne $firstAppPid) { throw "Japanese-path duplicate app process was started" }
          $exitCode = Invoke-CmdLauncher (Join-Path $copy "stop_bentoslide_app.cmd")
          if ($exitCode -ne 0) { throw "Japanese-path stop_bentoslide_app.cmd failed: $exitCode" }
          if ((Get-Process -Id $firstAppPid -ErrorAction SilentlyContinue) -or
              (Test-Path output/bentoslide-app.pid) -or (Test-Path output/bentoslide-app-session.json)) {
            throw "Japanese-path App process or session files remain"
          }
          $conflictListener = [System.Net.Sockets.TcpListener]::new([System.Net.IPAddress]::Loopback, 0)
          $conflictListener.Start()
          try {
            $busyAppPort = ([System.Net.IPEndPoint]$conflictListener.LocalEndpoint).Port
            $conflictExit = Invoke-CmdLauncher (Join-Path $copy "start_bentoslide_app.cmd") "-Port $busyAppPort -NoBrowser -NoClipboard"
            if ($conflictExit -eq 0) { throw "Japanese-path App accepted a conflicting port" }
            if ((Test-Path output/bentoslide-app.pid) -or (Test-Path output/bentoslide-app-session.json)) {
              throw "Japanese-path port conflict left App session files"
            }
          }
          finally { $conflictListener.Stop() }
          Copy-Item tests/fixtures/deck_v2.initialized.yaml deck.yaml
          $exitCode = Invoke-CmdLauncher (Join-Path $copy "start_deck_workspace.cmd") "-NoClipboard"
          if ($exitCode -ne 0) { throw "initialized start_deck_workspace.cmd failed: $exitCode" }
          if ((Test-Path output/html-preview-session.json) -or (Test-Path output/work-editor-session.json)) {
            throw "initialized workspace unexpectedly started a server"
          }
          Copy-Item $wholeDeckState deck.yaml
          $exitCode = Invoke-CmdLauncher (Join-Path $copy "start_deck_workspace.cmd") "-NoClipboard"
          if ($exitCode -ne 0) { throw "whole-deck start_deck_workspace.cmd failed: $exitCode" }
          $workspaceSession = Get-Content output/html-preview-session.json -Raw -Encoding utf8 | ConvertFrom-Json
          $workspaceStatus = Invoke-RestMethod -Uri ($workspaceSession.url + "api/status")
          if ($workspaceStatus.stage -ne "html_review" -or $workspaceStatus.mode -ne "single") {
            throw "whole-deck html_review did not route to HTML preview"
          }
          $exitCode = Invoke-CmdLauncher (Join-Path $copy "stop_deck_workspace.cmd")
          if ($exitCode -ne 0) { throw "whole-deck stop_deck_workspace.cmd failed: $exitCode" }
          if ((Test-Path output/html-preview.pid) -or (Test-Path output/html-preview-session.json)) {
            throw "whole-deck HTML preview session files remain"
          }
          $exitCode = Invoke-CmdLauncher (Join-Path $copy "start_html_preview.cmd") "-NoClipboard"
          if ($exitCode -ne 0) { throw "start_html_preview.cmd failed: $exitCode" }
          $previewSession = Get-Content output/html-preview-session.json -Raw -Encoding utf8 | ConvertFrom-Json
          $previewStatus = Invoke-RestMethod -Uri ($previewSession.url + "api/status")
          if ($previewStatus.format -ne "bento/html-preview-status/v1" -or $previewStatus.mode -ne "single") {
            throw "Unexpected schema v2 HTML preview status"
          }
          $previewPage = Invoke-WebRequest -Uri $previewSession.url -UseBasicParsing
          if ($previewPage.StatusCode -ne 200) { throw "HTML preview root did not respond" }
          $exitCode = Invoke-CmdLauncher (Join-Path $copy "stop_html_preview.cmd")
          if ($exitCode -ne 0) { throw "stop_html_preview.cmd failed: $exitCode" }
          if ((Test-Path output/html-preview.pid) -or (Test-Path output/html-preview-session.json)) {
            throw "HTML preview session files remain"
          }
          $resolvedCopy = [System.IO.Path]::GetFullPath($copy)
          $resolvedRunnerTemp = [System.IO.Path]::GetFullPath($env:RUNNER_TEMP).TrimEnd('\') + '\'
          if (-not $resolvedCopy.StartsWith($resolvedRunnerTemp, [System.StringComparison]::OrdinalIgnoreCase)) {
            throw "Refusing to prepare a fixture outside RUNNER_TEMP: $resolvedCopy"
          }
          $fixtureOutput = (& python -m tests.finalization_fixture --root $copy --confirm-disposable-fixture 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0) { throw "finalization fixture preparation failed: $fixtureOutput" }
          $deck = (& python -m scripts.deck_workflow status --json | Out-String) | ConvertFrom-Json
          if ($deck.schemaVersion -ne 2 -or $deck.workflow.stage -ne "bento_finalization") {
            throw "fixture did not reach schema v2 bento_finalization"
          }
          $generatedHash = (Get-FileHash output/presentation.generated.bento.html -Algorithm SHA256).Hash
          $authoringHash = (Get-FileHash $deck.outputs.authoringHtml -Algorithm SHA256).Hash
          $finalHash = (Get-FileHash $deck.outputs.finalHtml -Algorithm SHA256).Hash
          $registryHash = (Get-FileHash $deck.outputs.finalRegistry -Algorithm SHA256).Hash
          $editorArguments = "-Mode finalization -Source `"$($deck.outputs.authoringHtml)`" -Target `"$($deck.outputs.finalHtml)`" -Registry `"$($deck.outputs.finalRegistry)`" -NoClipboard"
          $exitCode = Invoke-CmdLauncher (Join-Path $copy "start_bento_editor.cmd") $editorArguments
          if ($exitCode -ne 0) { throw "start_bento_editor.cmd failed: $exitCode" }
          $session = Get-Content output/work-editor-session.json -Raw -Encoding utf8 | ConvertFrom-Json
          $status = Invoke-RestMethod -Uri ($session.url + "api/status")
          if ($status.editingMode -ne "finalization" -or $status.target -ne $deck.outputs.finalHtml -or -not $status.revision -or -not $status.validation) {
            throw "Unexpected Work editor status"
          }
          $firstPid = $session.pid
          $exitCode = Invoke-CmdLauncher (Join-Path $copy "start_bento_editor.cmd") $editorArguments
          if ($exitCode -ne 0) { throw "duplicate start failed: $exitCode" }
          $duplicate = Get-Content output/work-editor-session.json -Raw -Encoding utf8 | ConvertFrom-Json
          if ($duplicate.pid -ne $firstPid) { throw "duplicate process was started" }
          $commandLine = (Get-CimInstance Win32_Process -Filter "ProcessId = $firstPid").CommandLine
          if ($commandLine -match "--reset-final|--allow-content-edit") { throw "unsafe editor option detected" }
          $exitCode = Invoke-CmdLauncher (Join-Path $copy "stop_bento_editor.cmd")
          if ($exitCode -ne 0) { throw "stop_bento_editor.cmd failed: $exitCode" }
          if (Get-Process -Id $firstPid -ErrorAction SilentlyContinue) { throw "editor process is still running" }
          if ((Test-Path output/work-editor.pid) -or (Test-Path output/work-editor-session.json)) { throw "session files remain" }
          if ((Get-FileHash output/presentation.generated.bento.html -Algorithm SHA256).Hash -ne $generatedHash) {
            throw "generated artifact changed"
          }
          if ((Get-FileHash $deck.outputs.authoringHtml -Algorithm SHA256).Hash -ne $authoringHash) {
            throw "authoring artifact changed"
          }
          if ((Get-FileHash $deck.outputs.finalHtml -Algorithm SHA256).Hash -ne $finalHash) {
            throw "final artifact changed"
          }
          if ((Get-FileHash $deck.outputs.finalRegistry -Algorithm SHA256).Hash -ne $registryHash) {
            throw "final registry changed"
          }
          $exitCode = Invoke-CmdLauncher (Join-Path $copy "stop_bento_editor.cmd")
          if ($exitCode -ne 0) { throw "second stop failed: $exitCode" }

      - name: Stop launcher after failed smoke test
        if: always()
        shell: pwsh
        run: |
          $copy = Join-Path $env:RUNNER_TEMP "Bento Slide 論文スライド"
          $appStop = Join-Path $copy "stop_bentoslide_app.cmd"
          if ((Test-Path $appStop) -and (Test-Path (Join-Path $copy "output/bentoslide-app-session.json"))) {
            & $appStop
          }
          $previewStop = Join-Path $copy "scripts/stop_html_preview.ps1"
          if ((Test-Path $previewStop) -and (Test-Path (Join-Path $copy "output/html-preview-session.json"))) {
            & $previewStop
          }
          $stop = Join-Path $copy "scripts/stop_bento_editor.ps1"
          if ((Test-Path $stop) -and (Test-Path (Join-Path $copy "output/work-editor-session.json"))) {
            & $stop
          }
